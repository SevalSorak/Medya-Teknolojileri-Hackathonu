<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANADOLU:HABER ZAMAN TÜNELİ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'IM Fell English', serif;
            background: #2a1810 url('https://www.transparenttextures.com/patterns/old-map.png') repeat;
            background-size: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: scrollBackground 50s linear infinite;
        }

        @keyframes scrollBackground {
            0% { background-position: 0 0; }
            100% { background-position: 300px 300px; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
            pointer-events: none;
            opacity: 0.5;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 2;
        }

        .period-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .period-icon {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.15;
            animation: floatAndRotate 15s linear infinite;
        }

        .period-icon.cassette {
            width: 80px;
            height: 60px;
            top: 15%;
            left: 10%;
            animation-duration: 18s;
            background-color: #3b2a22; 
        }

        .period-icon.diskette {
            width: 70px;
            height: 70px;
            bottom: 20%;
            right: 15%;
            animation-duration: 20s;
            background-color: #3b2a22; 
        }

        .period-icon.cd {
            width: 90px;
            height: 90px;
            top: 50%;
            left: 80%;
            animation-duration: 22s;
            background-color: #3b2a22;
            border-radius: 50%; 
        }

        @keyframes floatAndRotate {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 700px;
            height: 85vh;
            max-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .newspaper {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, #f4e4c1 0%, #e8d4a8 25%, #dcc896 50%, #d4c0a0 75%, #c9b189 100%);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 100px rgba(139, 90, 43, 0.1);
            border: 1px solid #8b5a2b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(20px, 4vh, 40px) clamp(15px, 3vw, 30px);
        }

        .newspaper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 90, 43, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(139, 90, 43, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .newspaper-header {
            text-align: center;
            border-bottom: 3px double #8b5a2b;
            padding-bottom: clamp(10px, 2vh, 20px);
        }

        .masthead {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #2a1810;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(139, 90, 43, 0.2);
            line-height: 1.2;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .date-line {
            font-family: 'IM Fell English', serif;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            color: #5a3a1a;
            font-style: italic;
            margin-top: clamp(5px, 1vh, 10px);
            letter-spacing: 0.05em;
        }

        .newspaper-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vh, 20px); 
            padding: clamp(15px, 3vh, 30px) 0;
        }

        .headline {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 600;
            color: #2a1810;
            letter-spacing: 0.1em;
            line-height: 1.4;
            max-width: 90%;
            white-space: normal;
            animation: fadeIn 3s ease-in-out;
        }

        .ornamental-line {
            width: 60%;
            height: 2px;
            background: linear-gradient(to right, transparent, #8b5a2b 20%, #8b5a2b 80%, transparent);
            position: relative;
        }

        .ornamental-line::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e8d4a8;
            padding: 0 10px;
            color: #8b5a2b;
            font-size: 12px;
        }

        .date-box {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #8b5a2b;
            padding: clamp(15px, 2.5vh, 25px);
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .date-instruction {
            font-family: 'IM Fell English', serif;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #2a1810;
            margin-bottom: clamp(10px, 2vh, 15px);
            font-style: italic;
        }

        .date-input {
            width: 100%;
            padding: clamp(10px, 1.5vh, 12px) 15px;
            font-size: clamp(0.9rem, 1.8vw, 1.1rem);
            font-family: 'Crimson Text', serif;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #8b5a2b;
            color: #2a1810;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .date-input:hover,
        .date-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: sepia(1) saturate(2) hue-rotate(-10deg);
            cursor: pointer;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #8b5a2b;
            padding: clamp(10px, 2vh, 20px);
            width: 90%;
            max-width: 350px;
            text-align: center;
            font-family: 'IM Fell English', serif;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            color: #2a1810;
            font-style: italic;
            margin-top: clamp(0px, 1vh, 0px); 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
            animation: fadeIn 3.5s ease-in-out;
        }


        .cta-button {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #c9a961 0%, #6a4a2a 50%, #2a1810 100%);
            border: 3px solid #8b5a2b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(201, 169, 97, 0.7),
                inset 0 0 15px rgba(139, 90, 43, 0.5);
            transition: all 0.3s ease;
            overflow: hidden;
            z-index: 1;
        }

        .cta-button span {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            color: #f4e4c1;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            top: 50%;
            left: 50%;
            transition: transform 0.5s ease;
            z-index: -1;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: electricSpark 2s infinite ease-in-out;
            z-index: -1;
            opacity: 0;
        }

        .cta-button:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .cta-button:hover::after {
            opacity: 1;
        }

        .cta-button:hover {
            box-shadow: 
                0 0 30px rgba(201, 169, 97, 0.9),
                inset 0 0 20px rgba(139, 90, 43, 0.7);
            transform: scale(1.1);
        }

        .cta-button:active {
            transform: scale(0.95);
            box-shadow: 
                0 0 15px rgba(201, 169, 97, 0.5),
                inset 0 0 10px rgba(139, 90, 43, 0.3);
        }

        .cta-button:active::before {
            animation: burst 0.5s ease-out;
        }

        @keyframes electricSpark {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
        }

        @keyframes burst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .ink-spot {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 24, 16, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .door-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: none;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.9);
        }

        .door-overlay.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        .door-left, .door-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #3a2410 0%, #2a1810 50%, #1a0f0a 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            transition: transform 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .door-left {
            left: 0;
            border-right: 3px solid #8b5a2b;
        }

        .door-right {
            right: 0;
            border-left: 3px solid #8b5a2b;
        }

        .door-overlay.opening .door-left {
            transform: translateX(-100%);
        }

        .door-overlay.opening .door-right {
            transform: translateX(100%);
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #c9a961;
            text-shadow: 0 0 20px rgba(201, 169, 97, 0.6);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .door-overlay.opening .loading-text {
            opacity: 1;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #8b5a2b;
            border-top: 5px solid #c9a961;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .door-overlay.opening .loading-spinner {
            opacity: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                height: 90vh;
            }

            .masthead {
                line-height: 1.1;
            }

            .headline {
                font-size: clamp(1rem, 2.5vw, 1.5rem);
            }

            .cta-button {
                width: 100px;
                height: 100px;
                font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            }
        }

        @media (max-width: 480px) {
            .headline {
                max-width: 95%;
                font-size: clamp(0.9rem, 2vw, 1.2rem);
            }

            .date-box, .info-box {
                width: 95%;
            }

            .cta-button {
                width: 80px;
                height: 80px;
                font-size: clamp(0.6rem, 1vw, 0.8rem);
            }
        }
    </style>
</head>
<body>
    <div class="period-overlay">
        <div class="period-icon cassette"></div>
        <div class="period-icon diskette"></div>
        <div class="period-icon cd"></div>
    </div>

    <div class="container">
        <div class="newspaper">
            <div class="ink-spot" style="width: 60px; height: 60px; top: 10%; right: 8%;"></div>
            <div class="ink-spot" style="width: 40px; height: 40px; bottom: 15%; left: 10%;"></div>
            <div class="ink-spot" style="width: 50px; height: 50px; top: 60%; right: 12%;"></div>

            <div class="newspaper-header">
                <h1 class="masthead">ANADOLU:HABER ZAMAN TÜNELİ</h1>
            </div>

            <div class="newspaper-content">
                <h2 class="headline">Sizi Zaman İçinde Bir Yolculuk Bekliyor</h2>
                
                <div class="ornamental-line"></div>

                <div class="date-box">
                    <p class="date-instruction">Tarih Seçin</p>
                    <input type="date" class="date-input" id="dateInput" value="2024-01-01">
                </div>

                <div class="info-box">
                    <p>"Tarihin hafızayla buluştuğu yerde hikayeler canlanır"</p>
                </div>

                <button class="cta-button" id="goBtn">
                    <span>✦</span>
                </button>
            </div>

            <div class="newspaper-footer">
                </div>
        </div>
    </div>

    <div class="door-overlay" id="doorOverlay">
        <div class="door-left"></div>
        <div class="door-right"></div>
        <div class="loading-container">
            <div class="loading-text">Yolculuk Başlıyor...</div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script>
        const today = "2020-03-13"; 
        document.getElementById('dateInput').value = today;

        document.getElementById('goBtn').addEventListener('click', function() {
            const selectedDate = document.getElementById('dateInput').value;
            
            if (selectedDate) {
                sessionStorage.setItem('selectedDate', selectedDate);
                
                const doorOverlay = document.getElementById('doorOverlay');
                doorOverlay.classList.add('active'); 
            
                setTimeout(() => {
                    doorOverlay.classList.add('opening');
                }, 100);

                setTimeout(() => {
                    window.location.href = 'gallery.html';
                }, 2000);
            } else {
                alert('Lütfen yolculuğunuza devam etmek için bir tarih seçin.');
            }
        });

        document.getElementById('dateInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('goBtn').click();
            }
        });

        function addRandomInkSpots() {
            const newspaper = document.querySelector('.newspaper');
            for (let i = 0; i < 4; i++) {
                const spot = document.createElement('div');
                spot.className = 'ink-spot';
                spot.style.width = (Math.random() * 30 + 20) + 'px';
                spot.style.height = spot.style.width;
                spot.style.top = (Math.random() * 80 + 10) + '%';
                spot.style.left = (Math.random() * 80 + 10) + '%';
                spot.style.opacity = Math.random() * 0.1 + 0.05;
                newspaper.appendChild(spot);
            }
        }

        addRandomInkSpots();
    </script>
</body>
</html>

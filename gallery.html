<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadolu: Zaman Kristalleri Galerisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            background: #000;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container.grabbing { cursor: grabbing; }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(201, 169, 97, 0.3);
            z-index: 100;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 169, 97, 0.2);
        }

        .hud h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #c9a961;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 15px rgba(201, 169, 97, 0.5);
        }

        .hud-date {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(201, 169, 97, 0.2);
        }

        .hud-controls {
            font-size: 0.9rem;
            line-height: 2;
        }

        .hud-controls p {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .hud-controls strong {
            color: #c9a961;
            min-width: 90px;
        }

        .category-filter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(201, 169, 97, 0.3);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 169, 97, 0.2);
        }

        .category-filter h4 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            margin-bottom: 18px;
            color: #c9a961;
            text-shadow: 0 0 15px rgba(201, 169, 97, 0.5);
        }

        .category-badges {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-badge {
            padding: 12px 18px;
            background: rgba(201, 169, 97, 0.1);
            border: 2px solid rgba(201, 169, 97, 0.3);
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-badge:hover {
            background: rgba(201, 169, 97, 0.2);
            border-color: #c9a961;
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(201, 169, 97, 0.3);
        }

        .category-badge.active {
            background: rgba(201, 169, 97, 0.3);
            border-color: #c9a961;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 10, 6, 0.95) 0%, rgba(29, 16, 8, 0.98) 100%);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            max-width: 950px;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            border: 2px solid rgba(201, 169, 97, 0.4);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(201, 169, 97, 0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-content::-webkit-scrollbar { width: 10px; }
        .modal-content::-webkit-scrollbar-track { 
            background: rgba(20, 10, 6, 0.5); 
            border-radius: 10px; 
        }
        .modal-content::-webkit-scrollbar-thumb { 
            background: rgba(201, 169, 97, 0.6); 
            border-radius: 10px; 
        }

        .modal-visual {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
            border-radius: 25px 25px 0 0;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ai-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), transparent);
            color: #c9a961;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .modal-body {
            padding: 45px;
        }

        .modal-category {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 2px solid;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 25px;
            line-height: 1.4;
            color: #f4e4c1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .modal-content-text {
            font-size: 1.15rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            text-align: justify;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(201, 169, 97, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(201, 169, 97, 0.5);
            color: #c9a961;
            font-size: 32px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: bold;
        }

        .close-modal:hover {
            background: rgba(201, 169, 97, 0.4);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.6);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2d1810 0%, #0a0502 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading.hidden { display: none; }

        .loader {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(201, 169, 97, 0.2);
            border-top: 5px solid #c9a961;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(201, 169, 97, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #c9a961;
            animation: pulse 1.5s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(201, 169, 97, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .back-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 16px 32px;
            background: rgba(201, 169, 97, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(201, 169, 97, 0.4);
            border-radius: 18px;
            color: #c9a961;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            background: rgba(201, 169, 97, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(201, 169, 97, 0.4);
        }

        @media (max-width: 768px) {
            .hud, .category-filter {
                max-width: calc(100% - 40px);
                left: 20px;
                right: 20px;
            }
            .category-filter {
                top: auto;
                bottom: 100px;
            }
            .modal-content {
                max-width: 95%;
                margin: 20px;
            }
            .modal-body {
                padding: 25px;
            }
            .modal-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loader"></div>
        <div class="loading-text">Kristaller İnşa Ediliyor...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="hud">
        <h3>⏳ Zaman Kristalleri</h3>
        <div class="hud-date" id="selectedDate">Tarih: ...</div>
        <div class="hud-controls">
            <p><strong>🖱️ Fare:</strong> Etrafına Bak</p>
            <p><strong>⌨️ W/A/S/D:</strong> Hareket Et</p>
            <p><strong>🔮 Tıkla:</strong> Kristali Oku</p>
        </div>
    </div>

    <div class="category-filter">
        <h4>📂 Kristal Türleri</h4>
        <div class="category-badges" id="categoryBadges"></div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">
        ← Kadim Kapı
    </button>

    <div class="modal" id="modal">
        <button class="close-modal" id="closeModal">×</button>
        <div class="modal-content">
            <div class="modal-visual">
                <img id="modalImage" class="modal-image" src="" alt="">
                <div class="ai-label">✨ AI Kristal Görüntüleme Simülasyonu</div>
            </div>
            <div class="modal-body">
                <span class="modal-category" id="modalCategory"></span>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-content-text" id="modalContentText"></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, raycaster, mouse;
        let newsData = [];
        let paintings = [];
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        let moveState = { forward: false, backward: false, left: false, right: false };
        let velocity = new THREE.Vector3();
        const moveSpeed = 0.1;

        const categoryColors = {
            'darbe': '#ff4757',
            'deprem': '#e74c3c',
            'koronavirüs': '#9b59b6',
            'spor': '#2ed573',
            'kültür': '#a29bfe',
            'eğitim': '#3498db',
            'iklim': '#1abc9c',
            'teknoloji': '#5352ed'
        };

        async function init() {
            const selectedDate = sessionStorage.getItem('selectedDate');
            if (selectedDate) {
                const year = new Date(selectedDate).getFullYear();
                document.getElementById('selectedDate').textContent = 
                    `Tarih: ${new Date(selectedDate).toLocaleDateString('tr-TR', { 
                        year: 'numeric', month: 'long', day: 'numeric' 
                    })}`;
            }

            await loadNewsData();
            setupScene();
            createRoom(getThemeByYear(new Date(selectedDate).getFullYear()));
            createPaintings();
            createLights();
            setupEventListeners();
            animate();

            document.getElementById('loading').classList.add('hidden');
        }

        function getThemeByYear(year) {
            if (year >= 1980 && year <= 1989) return '80s';
            if (year >= 1990 && year <= 1999) return '90s';
            if (year >= 2000 && year <= 2009) return '2000s';
            if (year >= 2010 && year <= 2019) return '2010s';
            return 'ancient';
        }

        async function loadNewsData() {
            try {
                const response = await fetch('data/mockNews.json');
                const data = await response.json();
                
                let allNews = Array.isArray(data) ? data : data.news || [];
                allNews = allNews.map(news => ({
                    id: news.id || Math.random().toString(36).substr(2, 9),
                    title: news.haberBasligi,
                    category: news.haberKategorisi,
                    image: news.haberGorseli || '',
                    content: news.haberIcerigi,
                    date: news.haberTarihi
                }));

                // TARİH FİLTRELEME
                const selectedDate = sessionStorage.getItem('selectedDate');
                if (selectedDate) {
                    newsData = allNews.filter(news => news.date === selectedDate);
                    
                    // Eğer o tarihte haber yoksa
                    if (newsData.length === 0) {
                        console.warn('⚠️ Seçilen tarihte haber bulunamadı. En yakın tarihlerden gösteriliyor.');
                        // En yakın tarihteki haberleri bul
                        const sortedByDate = allNews.sort((a, b) => {
                            const diffA = Math.abs(new Date(a.date) - new Date(selectedDate));
                            const diffB = Math.abs(new Date(b.date) - new Date(selectedDate));
                            return diffA - diffB;
                        });
                        newsData = sortedByDate.slice(0, 12); // En yakın 12 haber
                    }
                } else {
                    newsData = allNews.slice(0, 12); // İlk 12 haber
                }

                console.log('✅ Yüklenen haber sayısı:', newsData.length);
                createCategoryBadges();
            } catch (error) {
                console.error('❌ Haber yükleme hatası:', error);
                newsData = [];
            }
        }

        function createCategoryBadges() {
            const categories = [...new Set(newsData.map(n => n.category))].filter(c => c);
            const container = document.getElementById('categoryBadges');

            categories.forEach(cat => {
                const badge = document.createElement('div');
                badge.className = 'category-badge active';
                badge.innerHTML = `
                    <div style="width: 14px; height: 14px; background: ${categoryColors[cat] || '#c9a961'}; border-radius: 50%; box-shadow: 0 0 10px ${categoryColors[cat] || '#c9a961'};"></div>
                    ${cat}
                `;
                badge.dataset.category = cat;
                badge.addEventListener('click', () => toggleCategory(badge, cat));
                container.appendChild(badge);
            });
        }

        function toggleCategory(badge, category) {
            badge.classList.toggle('active');
            paintings.forEach(p => {
                if (p.userData.category === category) {
                    p.visible = badge.classList.contains('active');
                }
            });
        }

        function setupScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
        }

        function createRoom(theme) {
            const roomSize = 12;
            const wallHeight = 4;
            let wallColor, floorColor, ceilingColor, bgColor, fogColor;

            switch (theme) {
                case '80s':
                    wallColor = 0x8b4789;
                    floorColor = 0x2d1b69;
                    ceilingColor = 0x4a148c;
                    bgColor = 0x1a0033;
                    fogColor = 0x1a0033;
                    break;
                case '90s':
                    wallColor = 0xb0b0b0;
                    floorColor = 0x707070;
                    ceilingColor = 0x909090;
                    bgColor = 0x505050;
                    fogColor = 0x505050;
                    break;
                case '2000s':
                    wallColor = 0x1e90ff;
                    floorColor = 0x0d1117;
                    ceilingColor = 0x2c3e50;
                    bgColor = 0x000000;
                    fogColor = 0x000000;
                    break;
                case '2010s':
                    wallColor = 0xecf0f1;
                    floorColor = 0xbdc3c7;
                    ceilingColor = 0xd5dbdb;
                    bgColor = 0x95a5a6;
                    fogColor = 0x95a5a6;
                    break;
                case 'ancient':
                default:
                    wallColor = 0x6b5d4f;
                    floorColor = 0x3a2f23;
                    ceilingColor = 0x4d4035;
                    bgColor = 0x1a1410;
                    fogColor = 0x1a1410;
                    break;
            }

            scene.background = new THREE.Color(bgColor);
            scene.fog = new THREE.Fog(fogColor, 1, 20);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(roomSize, roomSize),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.8, metalness: 0.2 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            const ceiling = new THREE.Mesh(
                new THREE.PlaneGeometry(roomSize, roomSize),
                new THREE.MeshStandardMaterial({ color: ceilingColor, side: THREE.DoubleSide })
            );
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = wallHeight;
            scene.add(ceiling);

            const wallMaterial = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.9 });
            
            const walls = [
                { pos: [0, wallHeight / 2, -roomSize / 2], rot: 0 },
                { pos: [0, wallHeight / 2, roomSize / 2], rot: Math.PI },
                { pos: [-roomSize / 2, wallHeight / 2, 0], rot: Math.PI / 2 },
                { pos: [roomSize / 2, wallHeight / 2, 0], rot: -Math.PI / 2 }
            ];

            walls.forEach(w => {
                const wall = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, wallHeight), wallMaterial);
                wall.position.set(w.pos[0], w.pos[1], w.pos[2]);
                wall.rotation.y = w.rot;
                scene.add(wall);
            });
        }

        function createPaintings() {
            const wallPositions = {
                'front': { z: -5.8, rotation: 0 },
                'back': { z: 5.8, rotation: Math.PI },
                'left': { x: -5.8, rotation: Math.PI / 2 },
                'right': { x: 5.8, rotation: -Math.PI / 2 }
            };

            const categoryWalls = {
                'darbe': 'front',
                'deprem': 'front',
                'koronavirüs': 'left',
                'spor': 'right',
                'kültür': 'back',
                'eğitim': 'left',
                'iklim': 'right',
                'teknoloji': 'back'
            };

            const newsByWall = {};
            newsData.forEach(news => {
                const wall = categoryWalls[news.category] || 'front';
                if (!newsByWall[wall]) newsByWall[wall] = [];
                newsByWall[wall].push(news);
            });

            // HER DUVARDA MAKSIMUM 4 HABER (köşelerde sıkışma önlenir)
            Object.keys(newsByWall).forEach(wall => {
                if (newsByWall[wall].length > 4) {
                    newsByWall[wall] = newsByWall[wall].slice(0, 4);
                }
            });

            Object.keys(newsByWall).forEach(wall => {
                const items = newsByWall[wall];
                const wallConfig = wallPositions[wall];
                const spacing = 3.0; // Daha geniş aralık
                const startOffset = -(items.length - 1) * spacing / 2;

                items.forEach((news, index) => {
                    createPainting(news, wall, wallConfig, startOffset + index * spacing);
                });
            });

            console.log('🎨 Toplam', paintings.length, 'kristal oluşturuldu');
        }

        function createPainting(news, wall, wallConfig, offset) {
            const paintingWidth = 1.8;
            const paintingHeight = 1.2;

            const frame = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth + 0.1, paintingHeight + 0.1),
                new THREE.MeshStandardMaterial({ color: 0x2c2c2c, metalness: 0.8, roughness: 0.2 })
            );

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 341;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 512, 341);
            const categoryColor = categoryColors[news.category] || '#c9a961';
            gradient.addColorStop(0, categoryColor);
            gradient.addColorStop(1, '#1a0f0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 341);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = 'bold 56px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔮', 256, 120);
            
            ctx.font = 'bold 36px Space Grotesk, Arial';
            ctx.fillText(news.category.toUpperCase(), 256, 200);
            
            ctx.font = '20px Space Grotesk, Arial';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            const shortTitle = news.title.length > 35 ? news.title.substring(0, 35) + '...' : news.title;
            
            const words = shortTitle.split(' ');
            let line = '';
            let y = 260;
            words.forEach((word, i) => {
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > 450 && line !== '') {
                    ctx.fillText(line, 256, y);
                    line = word + ' ';
                    y += 24;
                    if (y > 310) return;
                } else {
                    line = testLine;
                }
                if (i === words.length - 1) {
                    ctx.fillText(line, 256, y);
                }
            });

            const texture = new THREE.CanvasTexture(canvas);
            const image = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth, paintingHeight),
                new THREE.MeshStandardMaterial({ map: texture, emissive: 0x222222, emissiveIntensity: 0.2 })
            );
            image.position.z = 0.01;

const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 512;
            labelCanvas.height = 100;
            const labelCtx = labelCanvas.getContext('2d');
            
            labelCtx.fillStyle = categoryColor;
            labelCtx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
            
            labelCtx.fillStyle = '#ffffff';
            labelCtx.font = 'bold 24px Space Grotesk, Arial';
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            
            // Başlığı satırlara böl (max 50 karakter)
            const maxChars = 50;
            let labelTitle = news.title;
            if (labelTitle.length > maxChars) {
                labelTitle = labelTitle.substring(0, maxChars - 3) + '...';
            }
            
            // Kelime kelime bölerek 2 satıra sığdır
            const labelWords = labelTitle.split(' ');
            const lines = [];
            let currentLine = '';
            
            labelWords.forEach(word => {
                const testLine = currentLine + word + ' ';
                const metrics = labelCtx.measureText(testLine);
                if (metrics.width > 480 && currentLine !== '') {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            
            // Maksimum 2 satır göster
            const finalLines = lines.slice(0, 2);
            const lineHeight = 30;
            const startY = labelCanvas.height / 2 - ((finalLines.length - 1) * lineHeight / 2);
            
            finalLines.forEach((line, i) => {
                labelCtx.fillText(line, labelCanvas.width / 2, startY + i * lineHeight);
            });

            const label = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth, 0.35),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(labelCanvas) })
            );
            label.position.y = -(paintingHeight / 2 + 0.23);
            label.position.z = 0.01;

            const paintingGroup = new THREE.Group();
            paintingGroup.add(frame);
            paintingGroup.add(image);
            paintingGroup.add(label);

            if (wall === 'front' || wall === 'back') {
                paintingGroup.position.set(offset, 2, wallConfig.z);
            } else {
                paintingGroup.position.set(wallConfig.x, 2, offset);
            }

            paintingGroup.rotation.y = wallConfig.rotation;
            paintingGroup.userData = { newsId: news.id, category: news.category, clickable: true };
            image.userData = paintingGroup.userData;

            scene.add(paintingGroup);
            paintings.push(paintingGroup);
        }

        function createLights() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const walls = [
                { pos: [0, 3, -5], target: [0, 2, -5.9] },
                { pos: [0, 3, 5], target: [0, 2, 5.9] },
                { pos: [-5, 3, 0], target: [-5.9, 2, 0] },
                { pos: [5, 3, 0], target: [5.9, 2, 0] }
            ];

            walls.forEach(wall => {
                const light = new THREE.DirectionalLight(0xffffff, 0.6);
                light.position.set(...wall.pos);
                light.target.position.set(...wall.target);
                scene.add(light);
                scene.add(light.target);
            });

            const pointLight = new THREE.PointLight(0xffa500, 0.4);
            pointLight.position.set(0, 3.5, 0);
            scene.add(pointLight);
        }

        function setupEventListeners() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('mousedown', onMouseDown);
            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('mouseup', onMouseUp);
            container.addEventListener('click', onClick);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') closeModal();
            });
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseDown(event) {
            isMouseDown = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
            document.getElementById('canvas-container').classList.add('grabbing');
        }

        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                cameraRotation.y -= deltaX * 0.003;
                cameraRotation.x -= deltaY * 0.003;
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        }

        function onMouseUp() {
            isMouseDown = false;
            document.getElementById('canvas-container').classList.remove('grabbing');
        }

        function onClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            for (let intersect of intersects) {
                if (intersect.object.userData.clickable) {
                    openModal(intersect.object.userData.newsId);
                    break;
                }
            }
        }

        function onKeyDown(event) {
            switch (event.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = true; break;
                case 's': case 'arrowdown': moveState.backward = true; break;
                case 'a': case 'arrowleft': moveState.left = true; break;
                case 'd': case 'arrowright': moveState.right = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = false; break;
                case 's': case 'arrowdown': moveState.backward = false; break;
                case 'a': case 'arrowleft': moveState.left = false; break;
                case 'd': case 'arrowright': moveState.right = false; break;
                case 'escape': closeModal(); break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function openModal(newsId) {
            const news = newsData.find(n => n.id === newsId);
            if (!news) return;

            const categoryColor = categoryColors[news.category] || '#c9a961';
            document.getElementById('modalImage').src = news.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:' + categoryColor + ';stop-opacity:1"/><stop offset="100%" style="stop-color:%231a0f0a;stop-opacity:1"/></linearGradient></defs><rect width="900" height="450" fill="url(%23g)"/><text x="450" y="225" font-size="120" text-anchor="middle" fill="white">🔮</text></svg>';

            const modalCategory = document.getElementById('modalCategory');
            modalCategory.textContent = news.category;
            modalCategory.style.background = categoryColor + '33';
            modalCategory.style.borderColor = categoryColor;
            modalCategory.style.color = categoryColor;
            
            document.getElementById('modalTitle').textContent = news.title;
            document.getElementById('modalContentText').textContent = news.content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function updateMovement() {
            velocity.set(0, 0, 0);
            if (moveState.forward) velocity.z -= moveSpeed;
            if (moveState.backward) velocity.z += moveSpeed;
            if (moveState.left) velocity.x -= moveSpeed;
            if (moveState.right) velocity.x += moveSpeed;

            const euler = new THREE.Euler(0, cameraRotation.y, 0, 'YXZ');
            velocity.applyEuler(euler);

            const maxDistance = 5;
            camera.position.x = Math.max(-maxDistance, Math.min(maxDistance, camera.position.x + velocity.x));
            camera.position.z = Math.max(-maxDistance, Math.min(maxDistance, camera.position.z + velocity.z));
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotation.y;
            camera.rotation.x = cameraRotation.x;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>

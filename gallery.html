<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadolu: Zaman Kristalleri Galerisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            background: #000;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container.grabbing { cursor: grabbing; }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(201, 169, 97, 0.3);
            z-index: 100;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 169, 97, 0.2);
        }

        .hud h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #c9a961;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 15px rgba(201, 169, 97, 0.5);
        }

        .hud-date {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(201, 169, 97, 0.2);
        }

        .hud-controls {
            font-size: 0.9rem;
            line-height: 2;
        }

        .hud-controls p {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .hud-controls strong {
            color: #c9a961;
            min-width: 90px;
        }

        #transition-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, transparent 0%, #000000 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.6s ease-in-out;
}

#transition-overlay.active {
    opacity: 1;
}

        .category-filter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(201, 169, 97, 0.3);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 169, 97, 0.2);
        }

        .category-filter h4 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            margin-bottom: 18px;
            color: #c9a961;
            text-shadow: 0 0 15px rgba(201, 169, 97, 0.5);
        }

        .category-badges {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-badge {
            padding: 12px 18px;
            background: rgba(201, 169, 97, 0.1);
            border: 2px solid rgba(201, 169, 97, 0.3);
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-badge:hover {
            background: rgba(201, 169, 97, 0.2);
            border-color: #c9a961;
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(201, 169, 97, 0.3);
        }

        .category-badge.active {
            background: rgba(201, 169, 97, 0.3);
            border-color: #c9a961;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .modal .category-badge {
            display: inline-flex;
            gap: 10px;
            padding: 10px 14px;
            margin-right: 12px;
            transform: none;
        }

        .modal .category-badge:hover {
            transform: translateX(0);
            box-shadow: 0 6px 25px rgba(201, 169, 97, 0.25);
        }

        #speakText {
            color: #ffffff;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active { display: flex; }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 10, 6, 0.95) 0%, rgba(29, 16, 8, 0.98) 100%);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            max-width: 950px;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            border: 2px solid rgba(201, 169, 97, 0.4);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(201, 169, 97, 0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-content::-webkit-scrollbar { width: 10px; }
        .modal-content::-webkit-scrollbar-track { 
            background: rgba(20, 10, 6, 0.5); 
            border-radius: 10px; 
        }
        .modal-content::-webkit-scrollbar-thumb { 
            background: rgba(201, 169, 97, 0.6); 
            border-radius: 10px; 
        }

        .modal-visual {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
            border-radius: 25px 25px 0 0;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ai-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), transparent);
            color: #c9a961;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .modal-body {
            padding: 45px;
        }

        .modal-category {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 2px solid;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 25px;
            line-height: 1.4;
            color: #f4e4c1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .modal-content-text {
            font-size: 1.15rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            text-align: justify;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(201, 169, 97, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(201, 169, 97, 0.5);
            color: #c9a961;
            font-size: 32px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: bold;
        }

        .close-modal:hover {
            background: rgba(201, 169, 97, 0.4);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.6);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2d1810 0%, #0a0502 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading.hidden { display: none; }

        .loader {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(201, 169, 97, 0.2);
            border-top: 5px solid #c9a961;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(201, 169, 97, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #c9a961;
            animation: pulse 1.5s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(201, 169, 97, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .back-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 16px 32px;
            background: rgba(201, 169, 97, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(201, 169, 97, 0.4);
            border-radius: 18px;
            color: #c9a961;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            background: rgba(201, 169, 97, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(201, 169, 97, 0.4);
        }

        .name-label {
    position: fixed;
    color: white;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.7);
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 999; /* Modalın altında kalsın (modal z-index: 1000) */
    transition: opacity 0.2s ease;
}

.name-label.hidden {
    display: none !important;
}

.comment-bubble {
    position: fixed;
    color: #000000; /* Siyah yazı */
    font-family: 'Space Grotesk', sans-serif;
    font-size: 8px;
    background: rgba(255, 255, 255, 0.95); /* Beyaz arka plan */
    padding: 4px 8px;
    border-radius: 12px;
    pointer-events: none;
    z-index: 500;
    border: 2px ; /* Kategori rengine göre border */
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); /* Derinlik için gölge */
}




        @media (max-width: 768px) {
            .hud, .category-filter {
                max-width: calc(100% - 40px);
                left: 20px;
                right: 20px;
            }
            .category-filter {
                top: auto;
                bottom: 100px;
            }
            .modal-content {
                max-width: 95%;
                margin: 20px;
            }
            .modal-body {
                padding: 25px;
            }
            .modal-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="transition-overlay"></div>
    <div id="canvas-container"></div>

    <div class="hud">
        <h3>⏳ Zaman Kristalleri</h3>
        <div class="hud-date" id="selectedDate">Tarih: ...</div>
        <div class="hud-controls">
            <p><strong>🖱️ Fare:</strong> Etrafına Bak</p>
            <p><strong>⌨️ W/A/S/D:</strong> Hareket Et</p>
            <p><strong>🔮 Tıkla:</strong> Kristali Oku</p>
        </div>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">
        ← Zaman Tüneli
    </button>

    <div class="modal" id="modal">
        <button class="close-modal" id="closeModal">×</button>
        <div class="modal-content">
            <div class="modal-visual">
                <img id="modalImage" class="modal-image" src="" alt="">
                <div class="ai-label">✨ AI Kristal Görüntüleme Simülasyonu</div>
            </div>
            <div class="modal-body">
                <span class="modal-category" id="modalCategory"></span>
                <button class="speak-button category-badge" id="speakButton" style="display:inline-flex;align-items:center;gap:10px;">
                    <span id="speakIcon">🔊</span>
                    <span id="speakText">Seslendir</span>
                </button>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-content-text" id="modalContentText"></p>
            </div>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="loader"></div>
        <div class="loading-text">Anadolu'nun Tarihini Yüklüyoruz...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, raycaster, mouse;
        let newsData = [];
        let allNewsData = [];
        let paintings = [];
        let doors = [];
        let doorAnimations = [];
        let currentRoomCategory = null;
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        let moveState = { forward: false, backward: false, left: false, right: false };
        let velocity = new THREE.Vector3();
        let ceilingStructure = new THREE.Group();
        let npcs = [];
        let rooms = [{ x: 0, z: 0, category: 'main' }];
        const moveSpeed = 0.1;
        let ceilingAnimations = []; // Yeni animasyon dizisi
let highlightedPainting = null;


        const categoryColors = {
            'darbe': '#d35400', 
            'deprem': '#e74c3c', 
            'koronavirüs': '#f1c40f', 
            'spor': '#8e44ad', 
            'kültür': '#1abc9c',
            'eğitim': '#3498db',
            'iklim': '#2ecc71', 
            'teknoloji': '#e67e22'
        };


        const categoryComments = {
    'darbe': ['📰 Tarih yazılıyor!', '⚖️ Adalet zamanı!', '📜 Unutulmaz anlar!'],
    'deprem': ['🌍 Güçlü kalalım!', '🛠️ Yeniden inşa!', '🤝 Dayanışma zamanı!'],
    'koronavirüs': ['😷 Maske tak!', '🩺 Sağlık öncelik!', '🧼 Temiz kal!'],
    'spor': ['🏆 Zafer bizim!', '⚽ Gol zamanı!', '🏃‍♂️ Hızlı ol!'],
    'kültür': ['🎨 Sanat hayatı!', '📚 Hikaye anlat!', '🎭 Kültür yaşar!'],
    'eğitim': ['📖 Öğren, büyü!', '✏️ Gelecek senin!', '🎓 Bilgi güçtür!'],
    'iklim': ['🌱 Yeşil gelecek!', '🌍 Dünyayı koru!', '♻️ Geri dönüşüm!'],
    'teknoloji': ['💻 İnovasyon zamanı!', '🤖 Gelecek burada!', '🚀 Teknoloji uçurur!']
};

        class NPC {
            constructor(position, color, category) {
                this.position = position;
                this.category = category || 'default';
                this.speed = 0.4 + Math.random() * 0.4;
                this.rotationSpeed = 0.03;
                this.target = null;
                this.stuckTimer = 0;
                this.group = new THREE.Group();
                this.name = this.generateRandomName();
                
                this.createModel(color);
                this.createNameLabel();

                this.createCommentBubble();
                
                this.animationTime = Math.random() * Math.PI * 2;
                this.isWalking = false;
                this.idleTimer = 0;
                
                this.group.position.copy(position);
                this.pickNewTarget();
                scene.add(this.group);
            }

            generateRandomName() {
                const names = [
                    "Ali", "Ayşe", "Mehmet", "Fatma", "Mustafa", "Zeynep", "Ahmet", "Emine",
                    "Deniz", "Ege", "Can", "Elif", "Kaan", "Selin", "Baran", "Lale"
                ];
                return names[Math.floor(Math.random() * names.length)];
            }

createNameLabel() {
    this.nameLabel = document.createElement('div');
    this.nameLabel.className = 'name-label';
    this.nameLabel.textContent = this.name;
    this.nameLabel.style.opacity = '1'; 
    this.nameLabel.style.pointerEvents = 'none';
    document.body.appendChild(this.nameLabel);
}

createCommentBubble() {
    this.commentBubble = document.createElement('div');
    this.commentBubble.className = 'comment-bubble';
    
    // Kategoriye göre rastgele bir yorum seç
    const comments = categoryComments[this.category] || ['💬 Merhaba!', '👋 Selam!', '🎯 Harika!'];
    this.comment = comments[Math.floor(Math.random() * comments.length)];
    
    this.commentBubble.textContent = this.comment; // Şimdi this.comment tanımlı
    this.commentBubble.style.opacity = '1';
    this.commentBubble.style.pointerEvents = 'none';
    this.commentBubble.style.borderColor = categoryColors[this.category] || '#c9a961';
    document.body.appendChild(this.commentBubble);
}

updateNameLabelPosition() {
    if (!this.nameLabel || !this.head) return;
    
    // Modal açıkken her ikisini de gizle
    if (document.getElementById('modal').classList.contains('active')) {
        this.nameLabel.style.opacity = '0';
        if (this.commentBubble) this.commentBubble.style.opacity = '0';
        return;
    }

    const vector = new THREE.Vector3();
    vector.setFromMatrixPosition(this.head.matrixWorld);
    vector.y += 0.4;
    vector.project(camera);
    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
    const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

    const distance = camera.position.distanceTo(this.group.position);
    
    if (distance > 50 || vector.z > 1) {
        this.nameLabel.style.opacity = '0';
        if (this.commentBubble) this.commentBubble.style.opacity = '0';
        return;
    }

    const scaleFactor = 1.0 / (distance / 5 + 0.5);
    
    // İsim etiketi
    this.nameLabel.style.opacity = '1';
    this.nameLabel.style.left = x + 'px';
    this.nameLabel.style.top = y + 'px';
    this.nameLabel.style.transform = `translate(-50%, -100%) scale(${scaleFactor})`;
    
    // Yorum bulutu (isim etiketinin sağına yerleştir)
    if (this.commentBubble) {
        this.commentBubble.style.opacity = '1';
        this.commentBubble.style.left = (x + 60) + 'px'; // İsim etiketinin sağına 60px kaydır
        this.commentBubble.style.top = y + 'px';
        this.commentBubble.style.transform = `translate(0%, -100%) scale(${scaleFactor * 1.6})`; // Biraz daha küçük
    }
}

            createModel(color) {
                const primaryColor = color || 0xff6b6b;
                const skinColor = 0xfce3c2;
                const pantsColor = 0x555555;
                const hairColor = 0x000000;
                
                const bodyMaterial = new THREE.MeshStandardMaterial({
                    color: primaryColor,
                    roughness: 0.8,
                    metalness: 0.0
                });
                const headMaterial = new THREE.MeshStandardMaterial({
                    color: skinColor,
                    roughness: 0.7,
                    metalness: 0.05
                });
                const legMaterial = new THREE.MeshStandardMaterial({
                    color: pantsColor,
                    roughness: 0.8,
                    metalness: 0.1
                });
                const hairMaterial = new THREE.MeshStandardMaterial({
                    color: hairColor,
                    roughness: 0.5,
                    metalness: 0.1
                });

                this.group.scale.set(0.7, 0.7, 0.7);
                
                const headSize = 0.35;
                const headGeometry = new THREE.SphereGeometry(headSize, 32, 32);
                this.head = new THREE.Mesh(headGeometry, headMaterial);
                this.head.position.y = 1.0;
                this.head.castShadow = true;
                this.group.add(this.head);

                const hairSize = headSize * 0.6;
                const hairGeometry = new THREE.SphereGeometry(hairSize, 16, 16);
                this.hair = new THREE.Mesh(hairGeometry, hairMaterial);
                this.hair.position.y = 1.0 + headSize;
                this.hair.scale.set(1.0, 0.6, 1.0);
                this.hair.castShadow = true;
                this.group.add(this.hair);
                
                const bodyHeight = 0.5;
                const bodyGeometry = new THREE.BoxGeometry(0.5, bodyHeight, 0.3);
                this.body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                this.body.position.y = 0.40;
                this.body.castShadow = true;
                this.group.add(this.body);

                const eyeSize = 0.08;
                const headZOffset = headSize + 0.01;
                const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const eyeGeometry = new THREE.CircleGeometry(eyeSize, 32);
                
                this.leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                this.leftEye.position.set(-0.12, 1.05, headZOffset);
                this.rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                this.rightEye.position.set(0.12, 1.05, headZOffset);
                this.group.add(this.leftEye, this.rightEye);

                const armSize = 0.08;
                const armLength = 0.3;
                const armGeometry = new THREE.CylinderGeometry(armSize, armSize, armLength, 16);
                
                this.leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
                this.leftArm.position.set(-0.32, 0.4, 0);
                this.leftArm.rotation.z = Math.PI * 0.05;
                this.leftArm.castShadow = true;
                this.group.add(this.leftArm);

                this.rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
                this.rightArm.position.set(0.32, 0.4, 0);
                this.rightArm.rotation.z = -Math.PI * 0.05;
                this.rightArm.castShadow = true;
                this.group.add(this.rightArm);

                const legLength = 0.2;
                const legGeometry = new THREE.CylinderGeometry(0.12, 0.1, legLength, 16);
                
                this.leftLeg = new THREE.Mesh(legGeometry, legMaterial);
                this.leftLeg.position.set(-0.15, 0.1 + legLength / 2, 0);
                this.leftLeg.castShadow = true;
                this.group.add(this.leftLeg);

                this.rightLeg = new THREE.Mesh(legGeometry, legMaterial);
                this.rightLeg.position.set(0.15, 0.1 + legLength / 2, 0);
                this.rightLeg.castShadow = true;
                this.group.add(this.rightLeg);

                const footGeometry = new THREE.CylinderGeometry(0.14, 0.14, 0.05, 32);
                const footMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.8,
                    metalness: 0.2
                });
                this.leftFoot = new THREE.Mesh(footGeometry, footMaterial);
                this.leftFoot.position.set(-0.15, 0.025, 0.0);
                this.rightFoot = new THREE.Mesh(footGeometry, footMaterial);
                this.rightFoot.position.set(0.15, 0.025, 0.0);
                this.group.add(this.leftFoot, this.rightFoot);
            }

pickNewTarget() {
    // Duvar sınırları içinde hedef seç
    const wallLimit = 5.0;
    this.target = new THREE.Vector3(
        (Math.random() - 0.5) * wallLimit * 2,
        0,
        (Math.random() - 0.5) * wallLimit * 2
    );
    this.stuckTimer = 0;
    this.isWalking = true;
    this.idleTimer = 0;
}

            checkCollision(otherNPC) {
                const distance = this.group.position.distanceTo(otherNPC.group.position);
                return distance < 0.7;
            }

update(delta) {
    if (!this.target) return;

    this.updateNameLabelPosition();

    if (this.isWalking) {
        const direction = new THREE.Vector3()
            .subVectors(this.target, this.group.position)
            .normalize();

        let collision = false;
        
        // NPC'lerle çarpışma kontrolü
        for (let other of npcs) {
            if (other !== this) {
                if (this.checkCollision(other)) {
                    collision = true;
                    break;
                }
            }
        }
        
        // Duvar çarpışma kontrolü - BUNU EKLE
        const nextPos = this.group.position.clone().add(direction.clone().multiplyScalar(this.speed * delta));
        const wallLimit = 5.5; // Oda sınırı
        if (Math.abs(nextPos.x) > wallLimit || Math.abs(nextPos.z) > wallLimit) {
            collision = true;
            this.pickNewTarget(); // Yeni hedef seç
        }

        if (!collision) {
            this.group.position.add(direction.multiplyScalar(this.speed * delta));
            this.stuckTimer = 0;
        } else {
            this.stuckTimer += delta;
            if (this.stuckTimer > 1.5) {
                this.pickNewTarget();
            }
        }

        const targetAngle = Math.atan2(direction.x, direction.z);
        const currentAngle = this.group.rotation.y;
        let angleDiff = targetAngle - currentAngle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        this.group.rotation.y += angleDiff * this.rotationSpeed;

        this.animationTime += delta * 5;
        const swing = Math.sin(this.animationTime) * 0.4;
        this.leftArm.rotation.x = swing;
        this.rightArm.rotation.x = -swing;
        this.leftLeg.rotation.x = -swing;
        this.rightLeg.rotation.x = swing;
        
        if (this.group.position.distanceTo(this.target) < 0.5) {
            this.isWalking = false;
            this.idleTimer = 3 + Math.random() * 3;
        }
    } else {
        this.idleTimer -= delta;
        if (this.idleTimer <= 0) {
            this.pickNewTarget();
        }
        this.animationTime += delta * 0.5;
        this.body.position.y = 0.45 + Math.sin(this.animationTime * 2) * 0.02;
        this.leftArm.rotation.x = Math.sin(this.animationTime) * 0.1;
        this.rightArm.rotation.x = Math.sin(this.animationTime) * 0.1;
    }

    // NPC pozisyon sınırlaması - BUNU GÜNCELLE
    const maxDist = 5.5;
    this.group.position.x = Math.max(-maxDist, Math.min(maxDist, this.group.position.x));
    this.group.position.z = Math.max(-maxDist, Math.min(maxDist, this.group.position.z));
}

        function getThemeByYear(year) {
            if (year >= 1980 && year <= 1989) return '80s';
            if (year >= 1990 && year <= 1999) return '90s';
            if (year >= 2000 && year <= 2009) return '2000s';
            if (year >= 2010 && year <= 2019) return '2010s';
            return 'ancient';
        }

     async function loadNewsData() {
    try {
        const response = await fetch('data/mockNews.json');
        const data = await response.json();
        
        let allNews = Array.isArray(data) ? data : data.news || [];
        allNews = allNews.map(news => ({
            id: news.id || Math.random().toString(36).substr(2, 9),
            title: news.haberBasligi,
            category: news.haberKategorisi,
            image: news.haberGorseli || '',
            content: news.haberIcerigi,
            date: news.haberTarihi
        }));

        allNewsData = allNews;

        const selectedDate = sessionStorage.getItem('selectedDate');
        if (selectedDate) {
            newsData = allNewsData.filter(news => news.date === selectedDate);
            if (newsData.length === 0) {
                console.warn('⚠️ Seçilen tarihte haber bulunamadı.');
                const hud = document.getElementById('selectedDate');
                if (hud) {
                    hud.textContent = `Tarih: ${new Date(selectedDate).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' })} - Haber bulunamadı`;
                }
                newsData = [];
            }
        } else {
            newsData = [];
            const hud = document.getElementById('selectedDate');
            if (hud) hud.textContent = 'Tarih: Lütfen bir tarih seçin';
        }

        console.log('✅ Yüklenen haber sayısı:', newsData.length);
    } catch (error) {
        console.error('❌ Haber yükleme hatası:', error);
        newsData = [];
        const hud = document.getElementById('selectedDate');
        if (hud) hud.textContent = 'Hata: Haberler yüklenemedi';
    }
}
        
        function setupScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

        function createRoom(theme) {
            const roomSize = 12;
            const wallHeight = 4;
            let wallColor, floorColor, ceilingColor, bgColor, fogColor;

            wallColor = 0x8b5a34;
            floorColor = 0x4b2e1f;
            ceilingColor = 0xd9baa6;
            bgColor = 0x20140f;
            fogColor = 0x20140f;
            
            scene.children.filter(c => c.isMesh && (c.geometry.type === 'PlaneGeometry' || c.geometry.type === 'BoxGeometry')).forEach(c => scene.remove(c));
            
            scene.background = new THREE.Color(bgColor);
            scene.fog = new THREE.Fog(fogColor, 1, 20);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(roomSize, roomSize),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.8, metalness: 0.2 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            const ceiling = new THREE.Mesh(
                new THREE.PlaneGeometry(roomSize, roomSize),
                new THREE.MeshStandardMaterial({ color: ceilingColor, side: THREE.DoubleSide })
            );
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = wallHeight;
            scene.add(ceiling);

            window.wallMaterials = [
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.88, metalness: 0.03 }),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.88, metalness: 0.03 }),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.88, metalness: 0.03 }),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.88, metalness: 0.03 })
            ];

            const walls = [
                { pos: [0, wallHeight / 2, -roomSize / 2], rot: 0, mat: wallMaterials[0] },
                { pos: [0, wallHeight / 2, roomSize / 2], rot: Math.PI, mat: wallMaterials[1] },
                { pos: [-roomSize / 2, wallHeight / 2, 0], rot: Math.PI / 2, mat: wallMaterials[2] },
                { pos: [roomSize / 2, wallHeight / 2, 0], rot: -Math.PI / 2, mat: wallMaterials[3] }
            ];

            walls.forEach(w => {
                const wall = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, wallHeight), w.mat);
                wall.position.set(w.pos[0], w.pos[1], w.pos[2]);
                wall.rotation.y = w.rot;
                scene.add(wall);
            });
        }

        function createPaintings() {
            if (!currentRoomCategory) {
                clearPaintings();
                createDoors();
                ceilingStructure.visible = true; 
                return;
            }

            ceilingStructure.visible = false;
            clearPaintings();

            const wallPositions = {
                'front': { z: -5.8, rotation: 0 },
                'right': { x: 5.8, rotation: -Math.PI / 2 },
                'back': { z: 5.8, rotation: Math.PI },
                'left': { x: -5.8, rotation: Math.PI / 2 }
            };

            const categoryWalls = {
                'darbe': 'front',
                'deprem': 'front',
                'koronavirüs': 'left',
                'spor': 'right',
                'kültür': 'back',
                'eğitim': 'left',
                'iklim': 'right',
                'teknoloji': 'back'
            };

            const newsByWall = {};
            newsData.forEach(news => {
                const wall = categoryWalls[news.category] || 'front';
                if (!newsByWall[wall]) newsByWall[wall] = [];
                newsByWall[wall].push(news);
            });

            const wallOrder = ['front', 'right', 'back', 'left'];
            const maxColumns = 6;
            const maxRows = 3;
            const spacingX = 2.4;
            const spacingY = 1.9;
            const capacity = maxColumns * maxRows;

            if (currentRoomCategory) {
                const wallsToUse = ['front', 'right', 'left'];
                const perWallCapacity = 8;
                const colsForPerWall = 4;

                for (let w = 0; w < wallsToUse.length; w++) {
                    const wall = wallsToUse[w];
                    const wallConfig = wallPositions[wall];
                    const start = w * perWallCapacity;
                    const chunk = newsData.slice(start, start + perWallCapacity);
                    if (!chunk || chunk.length === 0) continue;

                    const cols = Math.min(colsForPerWall, chunk.length);
                    const rows = Math.ceil(chunk.length / cols);
                    const totalWidth = (cols - 1) * spacingX;
                    const totalHeight = (rows - 1) * spacingY;

                    for (let i = 0; i < chunk.length; i++) {
                        const col = i % cols;
                        const row = Math.floor(i / cols);
                        const offsetX = -(totalWidth / 2) + col * spacingX;
                        const offsetY = 2.2 + (totalHeight / 2) - row * spacingY;
                        createPainting(chunk[i], wall, wallConfig, offsetX, offsetY);
                    }
                }
            }
        }
        
        function clearPaintings() {
            paintings.forEach(p => {
                scene.remove(p);
                p.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                });
            });
            paintings = [];
        }

        function createDoor(targetCategory, position, rotation = 0) {
            const pos = position || { x: 2.5, y: 1.35, z: -5.5 };
            const catColorHex = categoryColors[targetCategory] || '#c9a961';
            const targetColor = new THREE.Color(catColorHex);
            
            const frameGeo = new THREE.BoxGeometry(1.3, 2.5, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xb8873a, metalness: 0.9, roughness: 0.18 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(pos.x, pos.y, pos.z - 0.13);
            frame.rotation.y = rotation;

            const portalGeo = new THREE.PlaneGeometry(1.2, 2.4);
            const portalMat = new THREE.MeshStandardMaterial({ 
                color: targetColor, 
                emissive: targetColor, 
                emissiveIntensity: 1.2 
            });
            const portal = new THREE.Mesh(portalGeo, portalMat);
            portal.position.set(pos.x, pos.y, pos.z - 0.05);
            portal.rotation.y = rotation;
            portal.visible = false;

            const doorGeo = new THREE.BoxGeometry(1.2, 2.4, 0.12);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x4b2e1a, metalness: 0.1, roughness: 0.6 });
            const door = new THREE.Mesh(doorGeo, doorMat);

            const pivot = new THREE.Group();
            const hingeOffset = 1.2 / 2;
            
            pivot.position.set(pos.x - Math.sin(rotation) * hingeOffset, pos.y, pos.z - Math.cos(rotation) * hingeOffset);
            door.position.set(Math.sin(rotation) * hingeOffset, 0, Math.cos(rotation) * hingeOffset);
            door.rotation.y = rotation;

            pivot.add(door);

            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 512;
            labelCanvas.height = 128;
            const labelCtx = labelCanvas.getContext('2d');
            labelCtx.fillStyle = '#111111';
            labelCtx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
            labelCtx.fillStyle = catColorHex;
            labelCtx.font = 'bold 42px Cinzel, Arial';
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            const labelText = (targetCategory === 'main') ? 'ANA SALON' : targetCategory.toUpperCase();
            labelCtx.fillText(labelText, labelCanvas.width / 2, labelCanvas.height / 2);

            const labelTex = new THREE.CanvasTexture(labelCanvas);
            const labelMat = new THREE.MeshStandardMaterial({ 
                map: labelTex, 
                toneMapped: false,
                emissive: targetColor,
                emissiveIntensity: 0.8
            });
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.35), labelMat);
            labelMesh.position.set(pos.x, pos.y + 1.4, pos.z + 0.01);
            labelMesh.rotation.y = rotation;

            const group = new THREE.Group();
            group.add(portal);
            group.add(frame);
            group.add(pivot);
            group.add(labelMesh);

            group.userData = {
                isDoor: true,
                targetCategory: targetCategory,
                pivot: pivot,
                doorMesh: door,
                portalMesh: portal,
                isOpen: false,
                isOpening: false,
                entered: false,
                rotation: rotation,
                pos: { x: pos.x, y: pos.y, z: pos.z },
                pendingEnter: false,
                enterTrigger: null
            };

            frame.userData = group.userData;
            pivot.userData = group.userData;
            door.userData = group.userData;
            labelMesh.userData = group.userData;
            portal.userData = group.userData;

            scene.add(group);
            doors.push(group);
        }

function openDoor(group) {
    if (!group || !group.userData) return;
    if (group.userData.isOpen || group.userData.isOpening) return;
    
    group.userData.portalMesh.visible = true;
    
    // Portal animasyonu EKLE
    let portalIntensity = 0;
    const portalInterval = setInterval(() => {
        portalIntensity += 0.05;
        if (portalIntensity >= 1.5) {
            portalIntensity = 1.5;
            clearInterval(portalInterval);
        }
        group.userData.portalMesh.material.emissiveIntensity = portalIntensity;
    }, 30);

    const pivot = group.userData.pivot;
    const start = pivot.rotation.y;
    const wallRot = group.userData.rotation || 0;
    const openAngle = Math.PI / 2;
    
    let target = start + (wallRot === 0 || wallRot === Math.PI ? -openAngle : openAngle);

    group.userData.isOpening = true;
    doorAnimations.push({ pivot: pivot, start: start, target: target, t: 0, duration: 600, group: group });
}

        function createDoors() {
            doors.forEach(d => scene.remove(d));
            doors = [];

            const fixedCategories = [
                'darbe', 'deprem', 'koronavirüs', 'spor', 
                'kültür', 'eğitim', 'iklim', 'teknoloji'
            ];

            if (!currentRoomCategory) {
                const categoriesToDisplay = fixedCategories.slice(0, 8);
                const slotPositions = [
                    { x: -1.5, z: -5.5, rot: 0 },
                    { x: 1.5, z: -5.5, rot: 0 },
                    { x: 5.5, z: -1.5, rot: -Math.PI / 2 },
                    { x: 5.5, z: 1.5, rot: -Math.PI / 2 },
                    { x: 1.5, z: 5.5, rot: Math.PI },
                    { x: -1.5, z: 5.5, rot: Math.PI },
                    { x: -5.5, z: 1.5, rot: Math.PI / 2 },
                    { x: -5.5, z: -1.5, rot: Math.PI / 2 }
                ];

                categoriesToDisplay.forEach((cat, i) => {
                    const slot = slotPositions[i];
                    if (!slot) return;
                    createDoor(cat, { x: slot.x, y: 1.35, z: slot.z }, slot.rot);
                });
            } else {
                createDoor('main', { x: 0, y: 1.35, z: 5.5 }, Math.PI);
            }
        }

        function createPainting(news, wall, wallConfig, offset, yOffset) {
            const paintingWidth = 1.8;
            const paintingHeight = 1.2;

            const frame = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth + 0.1, paintingHeight + 0.1),
                new THREE.MeshStandardMaterial({ color: 0x2c2c2c, metalness: 0.8, roughness: 0.2 })
            );

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 341;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 512, 341);
            const categoryColor = categoryColors[news.category] || '#c9a961';
            gradient.addColorStop(0, categoryColor);
            gradient.addColorStop(1, '#1a0f0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 341);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = 'bold 56px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔮', 256, 120);
            
            ctx.font = 'bold 36px Space Grotesk, Arial';
            ctx.fillText(news.category.toUpperCase(), 256, 200);
            
            ctx.font = '20px Space Grotesk, Arial';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            const shortTitle = news.title.length > 35 ? news.title.substring(0, 35) + '...' : news.title;
            
            const words = shortTitle.split(' ');
            let line = '';
            let y = 260;
            words.forEach((word, i) => {
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > 450 && line !== '') {
                    ctx.fillText(line, 256, y);
                    line = word + ' ';
                    y += 24;
                    if (y > 310) return;
                } else {
                    line = testLine;
                }
                if (i === words.length - 1) {
                    ctx.fillText(line, 256, y);
                }
            });

            const texture = new THREE.CanvasTexture(canvas);
            const image = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth, paintingHeight),
                new THREE.MeshStandardMaterial({ map: texture, emissive: 0x222222, emissiveIntensity: 0.2 })
            );
            image.position.z = 0.01;

            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 512;
            labelCanvas.height = 100;
            const labelCtx = labelCanvas.getContext('2d');
            
            labelCtx.fillStyle = categoryColors[news.category] || '#c9a961';
            labelCtx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
            
            labelCtx.fillStyle = '#ffffff';
            labelCtx.font = 'bold 24px Space Grotesk, Arial';
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            
            const maxChars = 50;
            let labelTitle = news.title;
            if (labelTitle.length > maxChars) {
                labelTitle = labelTitle.substring(0, maxChars - 3) + '...';
            }
            
            const labelWords = labelTitle.split(' ');
            const lines = [];
            let currentLine = '';
            
            labelWords.forEach(word => {
                const testLine = currentLine + word + ' ';
                const metrics = labelCtx.measureText(testLine);
                if (metrics.width > 480 && currentLine !== '') {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });
            if (currentLine) lines.push(currentLine.trim());
            
            const finalLines = lines.slice(0, 2);
            const lineHeight = 30;
            const startY = labelCanvas.height / 2 - ((finalLines.length - 1) * lineHeight / 2);
            
            finalLines.forEach((line, i) => {
                labelCtx.fillText(line, labelCanvas.width / 2, startY + i * lineHeight);
            });

            const label = new THREE.Mesh(
                new THREE.PlaneGeometry(paintingWidth, 0.35),
                new THREE.MeshStandardMaterial({ 
                    map: new THREE.CanvasTexture(labelCanvas), 
                    toneMapped: false 
                })
            );
            label.position.y = -(paintingHeight / 2 + 0.23);
            label.position.z = 0.01;

            const paintingGroup = new THREE.Group();
            paintingGroup.add(frame);
            paintingGroup.add(image);
            paintingGroup.add(label);

            const baseY = typeof yOffset === 'number' ? yOffset : 2;
            if (wall === 'front' || wall === 'back') {
                paintingGroup.position.set(offset, baseY, wallConfig.z);
            } else {
                paintingGroup.position.set(wallConfig.x, baseY, offset);
            }

            paintingGroup.rotation.y = wallConfig.rotation;
            paintingGroup.userData = { newsId: news.id, category: news.category, clickable: true };
            image.userData = paintingGroup.userData;

            scene.add(paintingGroup);
            paintings.push(paintingGroup);
        }

function createScrollingSignTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            
            const animationData = {
                canvas,
                ctx,
                texture,
                scrollOffset: 0,
                animationSpeed: 1, 
                text: text + ' ', // Metnin bitiminde bir boşluk bırak
                color: color
            };

            // Metni sağdan sola döngüsel olarak kaydıran çizim işlevi (Ticker efekti)
            const drawSign = (offset) => {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 512, 128);
                
                ctx.fillStyle = animationData.color;
                ctx.font = 'bold 40px Space Grotesk'; 
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                const fullText = animationData.text; 
                const textWidth = ctx.measureText(fullText).width;
                
                // Metnin kaydığı X konumu (Sağdan sola akış)
                // Offset, metnin başlama noktasını belirler.
                let currentX = 512 - (offset % (512 + textWidth));
                
                // Metni sürekli olarak çiz, böylece akış kesintisiz olur.
                ctx.fillText(fullText, currentX, 64);
                
                // Metin ekranın solundan tamamen çıkmadan hemen önce tekrar çizmeye başla
                if (currentX + textWidth < 512) {
                    ctx.fillText(fullText, currentX + textWidth, 64);
                }
            };
            
            animationData.drawSign = drawSign;
            ceilingAnimations.push(animationData);
            return texture;
        }

        function createButtonTexture() {
            const buttonCanvas = document.createElement('canvas');
            buttonCanvas.width = 128;
            buttonCanvas.height = 128;
            const buttonCtx = buttonCanvas.getContext('2d');
            const buttonTexture = new THREE.CanvasTexture(buttonCanvas);
            
            const drawButton = (isBlinking) => {
                buttonCtx.fillStyle = '#111111';
                buttonCtx.fillRect(0, 0, 128, 128);
                
                buttonCtx.fillStyle = isBlinking ? '#ff3333' : '#aa0000';
                buttonCtx.beginPath();
                buttonCtx.arc(64, 64, 50, 0, Math.PI * 2);
                buttonCtx.fill();

                buttonCtx.fillStyle = 'white';
                buttonCtx.font = 'bold 80px Arial';
                buttonCtx.textAlign = 'center';
                buttonCtx.textBaseline = 'middle';
                buttonCtx.fillText('▶', 68, 64);
                buttonTexture.needsUpdate = true;
            };

            const animationData = {
                isBlinking: true,
                texture: buttonTexture,
                drawButton: drawButton,
                blinkTimer: 0,
                blinkDuration: 0.5 
            };
            
            drawButton(true);
            ceilingAnimations.push(animationData);
            return buttonTexture;
        }


        function createCeilingStructure() {
            scene.remove(ceilingStructure);
            ceilingStructure.clear();
            ceilingAnimations = []; 

            const roomSize = 12;
            const wallHeight = 4;

            const lightIntensity = 0.9;
            const lightPositions = [
                { x: -2.3, z: -2.2 }, { x: -0.2, z: -2.3 }, { x: 2.1, z: -2.1 },
                { x: -2.2, z: -0.1 }, { x: 2.3, z: 0.2 },
                { x: -2.1, z: 2.3 }, { x: 0.1, z: 2.2 }, { x: 2.2, z: 2.1 }
            ];

            lightPositions.forEach((pos) => {
                const pointLight = new THREE.PointLight(0xffffff, lightIntensity, 10);
                pointLight.position.set(pos.x, wallHeight - 0.5, pos.z);
                ceilingStructure.add(pointLight);
            });

            const panelGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const panelMat = new THREE.MeshStandardMaterial({
                color: 0x5a5a5a, 
                metalness: 0.8, 
                roughness: 0.2,
                side: THREE.DoubleSide
            });
            const ceilingPanel = new THREE.Mesh(panelGeo, panelMat);
            ceilingPanel.rotation.x = Math.PI / 2;
            ceilingPanel.position.y = wallHeight - 0.1;

            ceilingStructure.add(ceilingPanel);

            // --- 1. Medya Teknolojileri Tabelası (Merkez) ---
            const signGeo = new THREE.BoxGeometry(3.5, 0.5, 0.1);
            const signMat = new THREE.MeshBasicMaterial({ color: 0x000000 }); 
            const wallCenterZ = 0;
            const signY = wallHeight - 1.2;

            const textCanvas = document.createElement('canvas');
            textCanvas.width = 512;
            textCanvas.height = 128;
            const textCtx = textCanvas.getContext('2d');
            textCtx.fillStyle = '#000000';
            textCtx.fillRect(0, 0, 512, 128);
            textCtx.fillStyle = '#ffffff';
            textCtx.font = 'bold 35px Space Grotesk'; 
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            textCtx.fillText('MEDYA TEKNOLOJİLERİ', 256, 40);
            textCtx.font = 'bold 45px Space Grotesk'; 
            textCtx.fillText('HACKATHONU', 256, 95);

            const signTexture = new THREE.CanvasTexture(textCanvas);
            const signEmissiveMatFront = new THREE.MeshBasicMaterial({ map: signTexture, toneMapped: false, side: THREE.FrontSide });
            const signEmissiveMatBack = new THREE.MeshBasicMaterial({ map: signTexture, toneMapped: false, side: THREE.BackSide });

            const signMesh = new THREE.Mesh(signGeo, [
                signMat,             
                signMat,             
                signMat,             
                signMat,             
                signEmissiveMatFront,
                signEmissiveMatBack  
            ]);
            signMesh.position.set(wallCenterZ, signY, 0);

            const cableMat = new THREE.LineBasicMaterial({ color: 0x888888, linewidth: 2 });
            const createCable = (x, y, z) => {
                const points = [];
                points.push(new THREE.Vector3(x, wallHeight - 0.05, z));
                points.push(new THREE.Vector3(x, y + 0.3, z)); 
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                return new THREE.Line(geometry, cableMat);
            };
            ceilingStructure.add(createCable(-1.6, signMesh.position.y, 0)); 
            ceilingStructure.add(createCable(1.6, signMesh.position.y, 0));

            ceilingStructure.add(signMesh);
            
            // --- 2. Hareketli "newshort" Tabelası (SOLDA) ---
            const shortSignGeo = new THREE.BoxGeometry(1.5, 0.3, 0.1);
            const shortSignFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            
            const shortSignTexture = createScrollingSignTexture('NewShort ->', '#e74c3c');
            const shortSignEmissiveMat = new THREE.MeshBasicMaterial({ map: shortSignTexture, toneMapped: false });
            
            const shortSignMesh = new THREE.Mesh(shortSignGeo, [
                shortSignFrameMat, 
                shortSignFrameMat, 
                shortSignFrameMat, 
                shortSignFrameMat, 
                shortSignEmissiveMat, // Front
                shortSignFrameMat     // Back
            ]);
            
            const shortSignGroup = new THREE.Group();
            shortSignGroup.add(shortSignMesh);
            shortSignGroup.position.set(-3.0, signY, 0); // Ana tabelanın soluna
            
            ceilingStructure.add(shortSignGroup);
            
            // --- 3. Short Butonu (SAĞDA) ---
            const buttonSize = 0.5;
            const shortButtonGeo = new THREE.PlaneGeometry(buttonSize, buttonSize);
            
            const buttonTexture = createButtonTexture();
            
            const shortButtonMesh = new THREE.Mesh(shortButtonGeo, new THREE.MeshBasicMaterial({ map: buttonTexture, toneMapped: false }));
            shortButtonMesh.position.set(0, 0, 0.1); // Z-ekseninde hafif öne
            
            const shortButtonGroup = new THREE.Group();
            shortButtonGroup.add(shortButtonMesh);
            
            shortButtonGroup.position.set(3.0, signY, 0); // Ana tabelanın sağına
            
            shortButtonGroup.userData = { clickable: true, action: 'openShorts' }; 
            shortButtonMesh.userData = shortButtonGroup.userData;

            ceilingStructure.add(shortButtonGroup);

            // Buton için de kablo ekleyelim
            ceilingStructure.add(createCable(shortButtonGroup.position.x, signY + 0.3, shortButtonGroup.position.z));

            scene.add(ceilingStructure);
        }

        function updateCeilingAnimations(delta) {
            ceilingAnimations.forEach(anim => {
                if (anim.drawSign) {
                    anim.scrollOffset += anim.animationSpeed * delta * 60; // Frame rate bağımsız kayma
                    anim.drawSign(anim.scrollOffset);
                    anim.texture.needsUpdate = true;
                }
                
                if (anim.drawButton) {
                    anim.blinkTimer += delta;
                    if (anim.blinkTimer >= anim.blinkDuration) {
                        anim.isBlinking = !anim.isBlinking;
                        anim.drawButton(anim.isBlinking);
                        anim.texture.needsUpdate = true;
                        anim.blinkTimer = 0;
                    }
                }
            });
        }


        function createLights() {
            const ambientLight = new THREE.AmbientLight(0xfff4e6, 0.72);
            scene.add(ambientLight);

            const walls = [
                { pos: [0, 3, -5], target: [0, 2, -5.9] },
                { pos: [0, 3, 5], target: [0, 2, 5.9] },
                { pos: [-5, 3, 0], target: [-5.9, 2, 0] },
                { pos: [5, 3, 0], target: [5.9, 2, 0] }
            ];

            walls.forEach(wall => {
                const light = new THREE.DirectionalLight(0xfff6e6, 0.7);
                light.position.set(...wall.pos);
                light.target.position.set(...wall.target);
                light.castShadow = true;
                light.shadow.mapSize.width = 512;
                light.shadow.mapSize.height = 512;
                light.shadow.camera.near = 0.5;
                light.shadow.camera.far = 50;
                scene.add(light);
                scene.add(light.target);
            });
        }

        function setupEventListeners() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('mousedown', onMouseDown);
            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('mouseup', onMouseUp);
            container.addEventListener('click', onClick);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') closeModal();
            });
            const speakBtn = document.getElementById('speakButton');
            if (speakBtn) speakBtn.addEventListener('click', toggleSpeak);
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseDown(event) {
            isMouseDown = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
            document.getElementById('canvas-container').classList.add('grabbing');
        }

        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                cameraRotation.y -= deltaX * 0.003;
                cameraRotation.x -= deltaY * 0.003;
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        }

        function onMouseUp() {
            isMouseDown = false;
            document.getElementById('canvas-container').classList.remove('grabbing');
        }

function onClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    
    for (let intersect of intersects) {
        if (intersect.object.userData && intersect.object.userData.isDoor) {
            let obj = intersect.object;
            while (obj && !obj.userData.isDoor) obj = obj.parent;
            const group = obj;
            if (group && group.userData) {
                openDoor(group); // Sadece kapıyı aç
            }
            break;
        }
        if (intersect.object.userData && intersect.object.userData.action === 'openShorts') {
            alert('Shorts Modu Aktifleştirildi! (Bu kısım için bir aksiyon tanımlanabilir)');
            break;
        }
        if (intersect.object.userData && intersect.object.userData.clickable) {
            openModal(intersect.object.userData.newsId);
            break;
        }
    }
}

        function onKeyDown(event) {
            switch (event.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = true; break;
                case 's': case 'arrowdown': moveState.backward = true; break;
                case 'a': case 'arrowleft': moveState.left = true; break;
                case 'd': case 'arrowright': moveState.right = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = false; break;
                case 's': case 'arrowdown': moveState.backward = false; break;
                case 'a': case 'arrowleft': moveState.left = false; break;
                case 'd': case 'arrowright': moveState.right = false; break;
                case 'escape': closeModal(); break;
            }
        }

        function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function openModal(newsId) {
    const news = newsData.find(n => n.id === newsId);
    if (!news) return;

    const categoryColor = categoryColors[news.category] || '#c9a961';
    document.getElementById('modalImage').src = news.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:' + categoryColor + ';stop-opacity:1"/><stop offset="100%" style="stop-color:%231a0f0a;stop-opacity:1"/></linearGradient></defs><rect width="900" height="450" fill="url(%23g)"/><text x="450" y="225" font-size="120" text-anchor="middle" fill="white">🔮</text></svg>';

    const modalCategory = document.getElementById('modalCategory');
    modalCategory.textContent = news.category;
    modalCategory.style.background = categoryColor + '33';
    modalCategory.style.borderColor = categoryColor;
    modalCategory.style.color = categoryColor;
    
    document.getElementById('modalTitle').textContent = news.title;
    document.getElementById('modalContentText').textContent = news.content;
    document.getElementById('modal').classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    stopSpeak();
}

let audioElement = null;
let isSpeaking = false;

function toggleSpeak() {
    const btn = document.getElementById('speakButton');
    if (!btn) return;
    if (isSpeaking) {
        stopSpeak();
    } else {
        const text = document.getElementById('modalContentText').textContent || document.getElementById('modalTitle').textContent;
        startSpeak(text);
    }
}

async function startSpeak(text) {
    if (isSpeaking) {
        stopSpeak();
    }

    try {
        console.log('Starting TTS for text:', text.substring(0, 50) + '...');
        
        // Buradaki API adresi local host veya ngrok tünel adresi olmalıdır.
        const response = await fetch('http://192.168.91.9:5000/api/tts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text: text
            })
        });

        if (!response.ok) {
            throw new Error(`TTS API error: ${response.status}`);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        if (!audioElement) {
            audioElement = new Audio();
            audioElement.addEventListener('ended', () => {
                isSpeaking = false;
                const btn = document.getElementById('speakButton');
                if (btn) {
                    btn.classList.remove('speaking');
                    document.getElementById('speakIcon').textContent = '🔊';
                    document.getElementById('speakText').textContent = 'Seslendir';
                }
                console.log('TTS playback ended');
            });
        }

        audioElement.src = audioUrl;
        audioElement.play();
        isSpeaking = true;
        
        const btn = document.getElementById('speakButton');
        if (btn) {
            btn.classList.add('speaking');
            document.getElementById('speakIcon').textContent = '⏸️';
            document.getElementById('speakText').textContent = 'Durdur';
        }
        console.log('TTS playback started');
    } catch (error) {
        console.error('TTS error:', error);
        alert('Seslendirme hatası: ' + error.message);
        isSpeaking = false;
        const btn = document.getElementById('speakButton');
        if (btn) {
            btn.classList.remove('speaking');
            document.getElementById('speakIcon').textContent = '🔊';
            document.getElementById('speakText').textContent = 'Seslendir';
        }
    }
}

function stopSpeak() {
    if (audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
        URL.revokeObjectURL(audioElement.src);
        audioElement.src = '';
        console.log('TTS playback stopped');
    }
    isSpeaking = false;
    const btn = document.getElementById('speakButton');
    if (btn) {
        btn.classList.remove('speaking');
        document.getElementById('speakIcon').textContent = '🔊';
        document.getElementById('speakText').textContent = 'Seslendir';
    }
}

function updateMovement() {
    velocity.set(0, 0, 0);
    if (moveState.forward) velocity.z -= moveSpeed;
    if (moveState.backward) velocity.z += moveSpeed;
    if (moveState.left) velocity.x -= moveSpeed;
    if (moveState.right) velocity.x += moveSpeed;

    const euler = new THREE.Euler(0, cameraRotation.y, 0, 'YXZ');
    velocity.applyEuler(euler);

    // Ana salonda da oda sınırı - BUNU GÜNCELLE
    const maxDistance = 5.5;
    camera.position.x = Math.max(-maxDistance, Math.min(maxDistance, camera.position.x + velocity.x));
    camera.position.z = Math.max(-maxDistance, Math.min(maxDistance, camera.position.z + velocity.z));
}

let lastTime = performance.now();
function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;
    
    updateMovement();
    updateDoorAnimations();
    updateCeilingAnimations(delta); 
    
    // NPC room-based visibility and update
    let currentRoom = rooms[0];
    for (let i = 1; i < rooms.length; i++) {
        const room = rooms[i];
        const distance = new THREE.Vector3(room.x, 0, room.z).distanceTo(camera.position);
        if (distance < 6) {
            currentRoom = room;
            break;
        }
    }

    npcs.forEach(npc => {
        const isInCurrentRoom = npc.room === currentRoom;
        npc.group.visible = isInCurrentRoom;
        if (npc.bubble) npc.bubble.style.display = isInCurrentRoom ? 'block' : 'none';
        if (isInCurrentRoom) npc.update(delta);
    });
    
    camera.rotation.order = 'YXZ';
    camera.rotation.y = cameraRotation.y;
    camera.rotation.x = cameraRotation.x;
    renderer.render(scene, camera);
}

function updateDoorAnimations() {
    const now = Date.now();
    for (let i = doorAnimations.length - 1; i >= 0; i--) {
        const a = doorAnimations[i];
        a.t += 16; 
        const p = Math.min(1, a.t / a.duration);
        const ease = 1 - Math.pow(1 - p, 3);
        a.pivot.rotation.y = a.start + (a.target - a.start) * ease;
        if (p >= 1) {
            a.group.userData.isOpen = true;
            a.group.userData.isOpening = false;
            console.log('✅ Door opened:', a.group.userData.targetCategory);
            
            a.group.userData.portalMesh.material.emissiveIntensity = 0.8;
            
            try {
                const target = a.group.userData.targetCategory;
                if (!a.group.userData.entered) {
                    a.group.userData.entered = false; 
                    a.group.userData.pendingEnter = true;
                    
                    const rot = a.group.userData.rotation || 0;
                    const nx = Math.sin(rot);
                    const nz = Math.cos(rot);
                    const offset = 0.5; // BUNU AZALT - daha yakın trigger
                    const cx = a.group.userData.pos.x + nx * offset;
                    const cz = a.group.userData.pos.z + nz * offset;
                    
                    const hx = 0.6; // BUNU AZALT - daha dar trigger
                    const hz = 0.7; // BUNU AZALT
                    a.group.userData.enterTrigger = { cx: cx, cz: cz, hx: hx, hz: hz, minY: 0.3, maxY: 2.5 };
                    a.group.userData.pendingEnter = true;
                    console.log('🟢 Door trigger set for', target);
                }
            } catch (e) {
                console.warn('Room switch preparation failed', e);
            }
            doorAnimations.splice(i, 1);
        }
    }

    // Kapıdan geçiş kontrolü - BUNU GÜNCELLE
    for (let d of doors) {
        try {
            if (d.userData && d.userData.pendingEnter && !d.userData.entered) {
                const t = d.userData.enterTrigger;
                if (!t) continue;
                const dx = camera.position.x - t.cx;
                const dz = camera.position.z - t.cz;
                const dy = camera.position.y;
                
                // Trigger mesafesini hesapla
                const distanceToTrigger = Math.sqrt(dx * dx + dz * dz);
                
                if (Math.abs(dx) <= t.hx && Math.abs(dz) <= t.hz && dy >= t.minY && dy <= t.maxY) {
                    d.userData.entered = true;
                    d.userData.pendingEnter = false;
                    const target = d.userData.targetCategory;
                    console.log('🚪 Walking through door — entering:', target);
                    
                    // Geçiş efekti EKLE
                    const overlay = document.getElementById('transition-overlay');
                    if (overlay) {
                        overlay.classList.add('active');
                        
                        // Ses efekti (isteğe bağlı)
                        const audio = new Audio();
                        audio.volume = 0.3;
                        // Kapı geçiş sesi buraya eklenebilir
                        
                        setTimeout(() => {
                            if (target === 'main') {
                                goToMainRoom();
                            } else {
                                enterCategoryRoom(target);
                            }
                            
                            // Kamera pozisyonunu kapının ötesine taşı
                            const rot = d.userData.rotation || 0;
                            const nx = Math.sin(rot);
                            const nz = Math.cos(rot);
                            camera.position.x = d.userData.pos.x + nx * 1.5;
                            camera.position.z = d.userData.pos.z + nz * 1.5;
                            
                            setTimeout(() => {
                                overlay.classList.remove('active');
                            }, 300);
                        }, 300);
                    }
                }
            }
        } catch (e) {
            console.warn('Error checking door trigger', e);
        }
    }
}
